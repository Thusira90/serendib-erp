services:
  postgres:
    image: postgres:16-alpine
    container_name: serendib-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: serendib
      POSTGRES_PASSWORD: serendib
      POSTGRES_DB: serendib_erp
    ports:
      - "5432:5432"
    volumes:
      - serendib_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serendib -d serendib_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  serendib_pg_data:
