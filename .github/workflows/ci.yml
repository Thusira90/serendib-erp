name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      AUTH_SECRET: "ci-only-not-a-real-secret-do-not-use-in-prod"
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_NAME: "Serendib Gemstones ERP"
      NEXT_PUBLIC_APP_ID_PREFIX: "SGS"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
